# 本地模型依赖清单
# 根目录由 .env 中 MODELS_DIR 指定
# 完整路径 = $MODELS_DIR / path

[whisper-cpp.ggml-base]
path = "whisper-cpp/ggml-base.bin"
size = "141MB"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
required = true
description = "whisper.cpp 语音转文字，日常转录默认模型"

[whisper-cpp.ggml-small]
path = "whisper-cpp/ggml-small.bin"
size = "244MB"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
required = false
description = "whisper.cpp 高质量转录"

[whisper-cpp.ggml-large]
path = "whisper-cpp/ggml-large-v3.bin"
size = "1.5GB"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin"
required = false
description = "whisper.cpp 最高质量转录"

[asr.qwen3-0_6b]
path = "Qwen3-ASR-0.6B"
size = "1.8GB"
url = "https://huggingface.co/Qwen/Qwen3-ASR-0.6B"
required = false
description = "通义千问 ASR，52语言，速度优先"

[asr.qwen3-1_7b-4bit]
path = "Qwen3-ASR-1.7B-4bit"
size = "1.5GB"
url = "https://huggingface.co/Qwen/Qwen3-ASR-1.7B-4bit"
required = true
description = "通义千问 ASR 4bit 量化版，转录默认模型（优先于 whisper）"

[asr.mimo-v2_5-mlx]
path = "MiMo-V2.5-ASR-MLX"
size = "5.1GB"
url = "https://huggingface.co/mlx-community/MiMo-V2.5-ASR-MLX"
required = false
description = "小米 MiMo，MLX 格式，中英双语，复杂声学场景"
