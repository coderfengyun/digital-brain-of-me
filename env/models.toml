# 本地模型依赖清单
# 根目录由 .env 中 MODELS_DIR 指定
# 完整路径 = $MODELS_DIR / path

[whisper-cpp.ggml-large]
path = "whisper-cpp/ggml-large-v3.bin"
size = "1.5GB"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin"
required = false
description = "whisper.cpp 最高质量转录"

[asr.qwen3-0_6b]
path = "Qwen3-ASR-0.6B-MLX"
size = "1.6GB"
url = "https://huggingface.co/mlx-community/Qwen3-ASR-0.6B-bf16"
required = true
description = "通义千问 ASR MLX 版，转录默认模型；本地不存在时回退 whisper"

[diarization.pyannote-community-1]
path = "pyannote/speaker-diarization-community-1"
size = "31MB"
url = "https://huggingface.co/pyannote/speaker-diarization-community-1"
required = false
description = "本地说话人分离；首次下载前需在 Hugging Face 接受模型许可"
